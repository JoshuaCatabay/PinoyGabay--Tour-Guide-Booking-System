<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Confirmation Required</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #d0d8d8;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .confirmation-container {
        position: relative;
        text-align: center;
        background-color: #ffffff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2); /* Added shadow */
        max-width: 400px;
        width: 90%;
      }
      .confirmation-container h1 {
        font-size: 24px;
        color: #333333;
        margin-bottom: 20px;
      }
      .confirmation-container p {
        font-size: 16px;
        color: #555555;
        margin-bottom: 30px;
      }
      .confirmation-container a {
        display: inline-block;
        text-decoration: none;
        background-color: #4ecdc4;
        color: #ffffff;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 14px;
        font-weight: bold;
        transition: background-color 0.3s;
      }
      .confirmation-container a:hover {
        background-color: #306862;
      }
      .close-button {
        position: absolute;
        top: 5px;
        left: 5px;
        background: none;
        border: none;
        font-size: 5px; /* Smaller font size for the "X" */
        color: #4ecdc4;
        cursor: pointer;
        transition: color 0.3s;
      }
      .close-button:hover {
        color: #306862;
      }
  </style>
</head>
<body>
  <div class="confirmation-container">
    <a class="close-button" href="{{ url_for('main.traveler_login') }}">&times;</a>
    <h1>Account Confirmation Required</h1>
    <p>You have registered successfully. Please check your email for a confirmation link to activate your account.</p>
  </div>
</body>
</html>
